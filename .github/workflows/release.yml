# Build the mod and publish a GitHub release whenever a version tag is pushed.
#
#   git tag v1.0.1 && git push origin v1.0.1
#
# The tag must match mod_version in gradle.properties (tag "v1.0.1" for
# mod_version=1.0.1), so a release can never ship a jar with the wrong version.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches mod_version
        run: |
          mod_version=$(sed -n 's/^mod_version=//p' gradle.properties)
          if [ "${GITHUB_REF_NAME}" != "v${mod_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match mod_version=${mod_version} (expected v${mod_version})"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/nohang-*.jar
          generate_release_notes: true
          fail_on_unmatched_files: true
